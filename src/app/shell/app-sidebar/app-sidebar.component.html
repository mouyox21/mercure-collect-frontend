<aside class="sidebar">
  <!-- Brand -->
  <div class="sidebar__brand">
    <div class="sidebar__logo" aria-hidden="true">M</div>
    <div class="sidebar__brand-text">
      <span class="sidebar__brand-name">MERCURE</span>
      <span class="sidebar__brand-sub">Collect AI</span>
    </div>
  </div>

  <!-- Role indicator -->
  <div class="sidebar__role-wrap">
    <span class="sidebar__role-badge">{{ roleLabel() }}</span>
  </div>

  <!-- Common navigation (visible for all roles, gated by right) -->
  <nav class="sidebar__nav" aria-label="Navigation principale">
    <ul class="sidebar__menu" role="list">

      <li *appHasRight="'DASHBOARD_VIEW'">
        <a routerLink="/dashboard" routerLinkActive="sidebar__link--active" class="sidebar__link">
          <svg class="sidebar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
          </svg>
          <span class="sidebar__label">Dashboard</span>
        </a>
      </li>

      <li *appHasRight="'CASE_VIEW'">
        <a routerLink="/dossiers" routerLinkActive="sidebar__link--active" class="sidebar__link">
          <svg class="sidebar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12.75V12A2.25 2.25 0 014.5 9.75h15A2.25 2.25 0 0121.75 12v.75m-8.69-6.44l-2.12-2.12a1.5 1.5 0 00-1.061-.44H4.5A2.25 2.25 0 002.25 6v12a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9a2.25 2.25 0 00-2.25-2.25h-5.379a1.5 1.5 0 01-1.06-.44z" />
          </svg>
          <span class="sidebar__label">Dossiers</span>
        </a>
      </li>

      <li *appHasRight="'CLIENT_VIEW'">
        <a routerLink="/clients" routerLinkActive="sidebar__link--active" class="sidebar__link">
          <svg class="sidebar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z" />
          </svg>
          <span class="sidebar__label">Clients</span>
        </a>
      </li>

    </ul>
  </nav>

  <!-- Contextual navigation (role-specific, below common nav) -->
  @if (contextualMenu().length > 0) {
    <hr class="sidebar__section-sep" aria-hidden="true" />
    <div class="sidebar__section-title" aria-hidden="true">{{ sectionTitle() }}</div>
    <nav class="sidebar__ctx-nav" [attr.aria-label]="sectionTitle()">
      <ul class="sidebar__ctx-menu" role="list">
        @for (item of contextualMenu(); track item.route + item.label) {
          <li>
            <a
              [routerLink]="item.route"
              [queryParams]="item.queryParams"
              [routerLinkActiveOptions]="linkActiveOptions(item)"
              routerLinkActive="sidebar__ctx-link--active"
              class="sidebar__ctx-link"
            >
              <svg class="sidebar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="iconPath(item.icon)"/>
              </svg>
              <span class="sidebar__ctx-label">{{ item.label }}</span>
            </a>
          </li>
        }
      </ul>
    </nav>
  }

  <!-- Profile footer -->
  <div class="sidebar__footer">
    <button class="sidebar__profile" type="button" aria-label="Profil utilisateur">
      <div class="sidebar__avatar" aria-hidden="true">{{ user().avatarInitials }}</div>
      <span class="sidebar__agent-name">{{ user().name }}</span>
    </button>
  </div>
</aside>
