<aside class="sidebar">
  <!-- Brand -->
  <div class="sidebar__brand">
    <div class="sidebar__logo" aria-hidden="true">M</div>
    <div class="sidebar__brand-text">
      <span class="sidebar__brand-name">MERCURE</span>
      <span class="sidebar__brand-sub">Collect AI</span>
    </div>
  </div>

  <!-- Role indicator -->
  <div class="sidebar__role-wrap">
    <span class="sidebar__role-badge">{{ roleLabel() }}</span>
  </div>

  <!-- Common navigation (visible for all roles, gated by right) -->
  <nav class="sidebar__nav" aria-label="Navigation principale">
    <ul class="sidebar__menu" role="list">

      <li *appHasRight="'DASHBOARD_VIEW'">
        <a routerLink="/dashboard" routerLinkActive="sidebar__nav-link--active" class="sidebar__nav-link">
          <mc-icon name="home" />
          <span class="sidebar__nav-label">Dashboard</span>
        </a>
      </li>

      <li *appHasRight="'CASE_VIEW'">
        <a routerLink="/dossiers" routerLinkActive="sidebar__nav-link--active" class="sidebar__nav-link">
          <mc-icon name="folder" />
          <span class="sidebar__nav-label">Dossiers</span>
        </a>
      </li>

      <li *appHasRight="'CLIENT_VIEW'">
        <a routerLink="/clients" routerLinkActive="sidebar__nav-link--active" class="sidebar__nav-link">
          <mc-icon name="users" />
          <span class="sidebar__nav-label">Clients</span>
        </a>
      </li>

    </ul>
  </nav>

  <!-- Contextual navigation (role-specific, below common nav) -->
  @if (contextualMenu().length > 0) {
    <hr class="sidebar__section-sep" aria-hidden="true" />
    <nav class="sidebar__ctx-nav" [attr.aria-label]="sectionTitle()">
      <mc-side-nav-panel
        variant="dark"
        [title]="sectionTitle()"
        [items]="contextualMenu()" />
    </nav>
  }

  <!-- Profile footer -->
  <div class="sidebar__footer">
    <button class="sidebar__profile" type="button" aria-label="Profil utilisateur">
      <div class="sidebar__avatar" aria-hidden="true">{{ user().avatarInitials }}</div>
      <span class="sidebar__agent-name">{{ user().name }}</span>
    </button>
  </div>
</aside>
