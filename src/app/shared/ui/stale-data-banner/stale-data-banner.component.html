<div class="stale-banner" role="alert" aria-live="polite">
  <div class="stale-banner__icon" aria-hidden="true">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.5" fill="none"/>
      <path d="M8 4.5v4l2.5 1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <span class="stale-banner__message">{{ message() }}</span>
  <button class="stale-banner__btn" type="button" (click)="refresh.emit()">
    Actualiser
  </button>
</div>
