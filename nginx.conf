server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for text-based assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/css
        application/javascript
        application/json
        image/svg+xml
        font/woff2;

    # Orchestrator health check — returns 200 with no logging overhead
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'OK\n';
    }

    # Long-duration cache for hashed static assets.
    # Angular appends a content hash to every JS/CSS/font filename (outputHashing: "all"),
    # so these files are safe to cache indefinitely — a new deployment produces new filenames.
    location ~* \.(js|mjs|css|woff2?|ttf|otf|eot|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
    }

    # SPA fallback — unknown paths serve index.html; Angular router handles client-side routing.
    # No-cache on index.html ensures browsers always fetch the latest entry point after a deployment.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }
}
